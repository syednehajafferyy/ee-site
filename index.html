<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>for you ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe9f2;--bg2:#ffc4da;--pink:#ff5e9c;--hot:#ff2f86;--ink:#8a2a55;--card:#fff8fb;--key:#fff;--keyedge:#f3a6c4;--screen:#fff0f6;--line:#ffc2d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3b1228;--bg2:#5a1d3d;--pink:#ff7db0;--hot:#ff4f9a;--ink:#ffd6e8;--card:#4a1a34;--key:#6e2c4c;--keyedge:#2f0e20;--screen:#37122a;--line:#7a3358;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#3b1228;--bg2:#5a1d3d;--pink:#ff7db0;--hot:#ff4f9a;--ink:#ffd6e8;--card:#4a1a34;--key:#6e2c4c;--keyedge:#2f0e20;--screen:#37122a;--line:#7a3358;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;overflow:hidden;font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;font-weight:600;color:var(--ink);background:radial-gradient(circle at 20% 10%,var(--bg1),var(--bg2) 120%)}
.script{font-family:'Pacifico','Brush Script MT',cursive;font-weight:400}
#bg,#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx{z-index:50}
.bgh{position:absolute;bottom:-40px;opacity:0;color:var(--pink);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(-8deg);opacity:0}15%{opacity:.4}85%{opacity:.3}100%{transform:translateY(-110vh) rotate(10deg);opacity:0}}
.screen{position:absolute;inset:0;overflow-y:auto;display:flex;padding:16px;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;z-index:2}
.screen.active{opacity:1;visibility:visible}
.wrap{margin:auto;width:100%;max-width:440px;text-align:center}
.card{background:var(--card);border:2.5px dashed var(--line);border-radius:32px;padding:22px 16px 18px;box-shadow:0 14px 40px rgba(255,94,156,.25),0 3px 0 var(--line);animation:enter .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
.card.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-12px) rotate(-1deg)}40%{transform:translateX(10px) rotate(1deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
.card.closing{animation:close .75s cubic-bezier(.6,0,.4,1) forwards}
@keyframes close{0%{transform:scale(1);opacity:1}55%{transform:scale(1.04,.03);opacity:1;filter:brightness(1.3)}100%{transform:scale(0,0);opacity:0}}
.bow{font-size:34px;display:inline-block;animation:wig 3s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(8deg) scale(1.1)}}
h1{font-size:2rem;margin:4px 0 2px;color:var(--hot)}
.sub{margin:0 0 10px;font-size:.95rem;opacity:.85}
.q{font-size:1.5rem;font-weight:800;margin:6px 0 12px}
.display{min-height:54px;display:flex;align-items:center;justify-content:center;background:var(--screen);border:2.5px solid var(--line);border-radius:18px;font-size:1.5rem;font-weight:800;padding:6px 12px;margin-bottom:8px;box-shadow:inset 0 3px 8px rgba(255,94,156,.15);overflow:hidden;word-break:break-all}
.display .ph{opacity:.4;font-weight:600;font-size:1rem}
.cur{display:inline-block;width:3px;height:1.2em;background:var(--hot);margin-left:2px;border-radius:2px;animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.err{min-height:30px;margin:2px 0 8px;font-weight:800;color:var(--hot);font-size:1.02rem}
.err.pop{animation:epop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes epop{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.kb{background:linear-gradient(#ffd3e4,#ffb8d3);padding:10px 6px 8px;border-radius:20px;box-shadow:0 5px 0 #f08ab2,0 10px 18px rgba(255,94,156,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kb{background:linear-gradient(#8a3a62,#6a2548);box-shadow:0 5px 0 #2f0e20}}
.row{display:flex;justify-content:center;gap:4px;margin-bottom:5px}
.key{flex:1 1 0;max-width:40px;height:44px;border:0;border-radius:10px;background:var(--key);color:var(--ink);font:800 1rem 'Nunito',system-ui,sans-serif;box-shadow:0 4px 0 var(--keyedge);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s;padding:0;user-select:none}
.key.wide{max-width:64px;flex:1.6 1 0;font-size:.85rem}
.key.space{max-width:none;flex:5 1 0}
.key.enter{max-width:none;flex:2.4 1 0;background:var(--hot);color:#fff;box-shadow:0 4px 0 #c21d63}
.key.down,.key:active{transform:translateY(4px);box-shadow:0 0 0 var(--keyedge)}
.key:focus-visible,.btn:focus-visible,.snd:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.foot{margin-top:14px;font-size:.85rem;opacity:.8}
.snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:60;border:0;border-radius:999px;background:var(--card);color:var(--ink);padding:8px 12px;font:800 .8rem 'Nunito',system-ui,sans-serif;box-shadow:0 3px 0 var(--line);cursor:pointer}
.big{font-size:clamp(2.4rem,13vw,4.2rem);color:var(--hot);min-height:1.4em;margin:0;line-height:1.3;text-shadow:0 3px 0 #fff,0 6px 14px rgba(255,94,156,.35)}
.big .ch{display:inline-block;animation:chp .28s cubic-bezier(.2,1.8,.4,1) both}
@keyframes chp{from{transform:translateY(10px) scale(.4);opacity:0}to{transform:none;opacity:1}}
.cur.off{opacity:0;animation:none;transition:opacity .6s}
.metoo{font-size:2rem;margin:6px 0 0;color:var(--pink);opacity:0;transform:scale(.6)}
.metoo.show{animation:epop .7s cubic-bezier(.2,1.6,.4,1) forwards}
.bear{width:130px;height:auto;margin:10px auto 6px;display:block;opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s}
.bear.show{opacity:1;transform:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.btn{border:0;border-radius:999px;background:linear-gradient(#ff7db0,var(--hot));color:#fff;font:800 1.15rem 'Nunito',system-ui,sans-serif;padding:15px 30px;box-shadow:0 6px 0 #c21d63,0 12px 22px rgba(255,47,134,.35);cursor:pointer;transition:transform .12s,box-shadow .12s;touch-action:manipulation}
.btn:hover{transform:translateY(-3px) rotate(-2deg) scale(1.04)}
.btn:active{transform:translateY(5px) scale(.97);box-shadow:0 1px 0 #c21d63}
.gift{opacity:0;pointer-events:none;transform:scale(.6);transition:opacity .6s,transform .6s}
.gift.show{opacity:1;pointer-events:auto;transform:none;animation:beat 1.6s ease-in-out .6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.08)}28%{transform:scale(1)}42%{transform:scale(1.06)}}
.kiss{font-size:clamp(6rem,38vw,9.5rem);line-height:1;display:inline-block;transform:scale(0)}
.screen.active .kiss{animation:kpop .9s cubic-bezier(.2,1.7,.4,1) .35s forwards,kwig 2.6s ease-in-out 1.4s infinite}
@keyframes kpop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes kwig{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.08)}}
.mw{font-size:clamp(2.2rem,12vw,3.6rem);color:var(--hot);margin:6px 0;opacity:0}
.screen.active .mw,.screen.active .msg,.screen.active .again{animation:epop .8s cubic-bezier(.2,1.6,.4,1) 1s forwards}
.screen.active .msg{animation-delay:1.3s}.screen.active .again{animation-delay:1.6s}
.msg{font-size:1.15rem;margin:0 0 16px;opacity:0}
.again{opacity:0}
.p{position:absolute;font-size:var(--s,22px);animation:fly 1.5s cubic-bezier(.1,.7,.3,1) forwards;will-change:transform}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}80%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));opacity:0}}
.fl{position:absolute;bottom:-30px;animation:rise2 linear forwards}
@keyframes rise2{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-110vh) translateX(var(--sw));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.bgh{display:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<button class="snd" id="snd" aria-pressed="false" aria-label="Toggle key click sounds">🔇 sound off</button>

<main id="app">
<section class="screen active" id="s1" aria-label="Question">
 <div class="wrap">
  <div class="card" id="card">
   <div class="bow" aria-hidden="true">🎀</div>
   <h1 class="script">heyyy, you! ♡</h1>
   <p class="sub">i have a very important question for you...</p>
   <div class="q">do you love me?</div>
   <div class="display" id="disp" role="textbox" aria-label="Your answer" aria-live="polite"></div>
   <div class="err" id="err" role="alert"></div>
   <div class="kb" id="kb" role="group" aria-label="Pink keyboard"></div>
   <div class="foot">made with love, just for you ♡</div>
  </div>
 </div>
</section>

<section class="screen" id="s2" aria-label="Reveal">
 <div class="wrap">
  <h2 class="big script" id="big" aria-label="awwwwwww"><span id="typed" aria-hidden="true"></span><span class="cur" id="cur2" aria-hidden="true"></span></h2>
  <p class="metoo script" id="metoo">me too ♡</p>
  <svg class="bear" id="bear" viewBox="0 0 120 110" aria-hidden="true">
   <path d="M60 104C20 76 6 52 6 34 6 18 18 8 32 8c11 0 22 7 28 18C66 15 77 8 88 8c14 0 26 10 26 26 0 18-14 42-54 70z" fill="#ff8fb8" stroke="#ff5e9c" stroke-width="3"/>
   <ellipse cx="42" cy="48" rx="5" ry="7" fill="#7a1f4a"/><ellipse cx="78" cy="48" rx="5" ry="7" fill="#7a1f4a"/>
   <circle cx="44" cy="45" r="1.8" fill="#fff"/><circle cx="80" cy="45" r="1.8" fill="#fff"/>
   <ellipse cx="30" cy="60" rx="8" ry="5" fill="#ff5e9c" opacity=".55"/><ellipse cx="90" cy="60" rx="8" ry="5" fill="#ff5e9c" opacity=".55"/>
   <path d="M53 62q7 9 14 0" fill="none" stroke="#7a1f4a" stroke-width="3" stroke-linecap="round"/>
   <path d="M60 20 48 12 48 28zM60 20 72 12 72 28z" fill="#fff" stroke="#ff2f86" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
  <button class="btn gift" id="gift" disabled aria-label="Open your gift">OPEN UR GIFT 🎁</button>
  <div class="foot">made with love, just for you ♡</div>
 </div>
</section>

<section class="screen" id="s3" aria-label="Your kiss">
 <div class="wrap">
  <div class="kiss" id="kiss" aria-hidden="true">💋</div>
  <h2 class="mw script">MWAHHH!!</h2>
  <p class="msg">one kiss, delivered just for you ♡</p>
  <button class="btn again" id="again">send another 💋</button>
  <div class="foot">made with love, just for you ♡</div>
 </div>
</section>
</main>
<div id="fx" aria-hidden="true"></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var rnd=function(a,b){return a+Math.random()*(b-a)};
var state={screen:1,text:"",busy:false,token:0},timers=[],floatTimer=null;
var disp=$("disp"),err=$("err"),card=$("card"),fx=$("fx");

/* background hearts */
var bg=$("bg"),bgChars=["♡","♥","✦","♡"];
for(var i=0;i<(reduce?0:10);i++){var h=document.createElement("span");h.className="bgh";h.textContent=bgChars[i%4];
 h.style.cssText="left:"+rnd(2,96)+"%;font-size:"+rnd(14,30)+"px;animation-duration:"+rnd(14,26)+"s;animation-delay:-"+rnd(0,20)+"s";bg.appendChild(h)}

/* sound (muted by default) */
var sndOn=false,ac=null;
$("snd").onclick=function(){sndOn=!sndOn;this.setAttribute("aria-pressed",sndOn);this.textContent=sndOn?"🔊 sound on":"🔇 sound off";if(sndOn)click(900)};
function click(f){if(!sndOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 var o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f||rnd(600,900);
 g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.08);
 o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.09)}catch(e){}}

/* keyboard */
var rows=["qwertyuiop","asdfghjkl","zxcvbnm"],kb=$("kb");
function mk(label,val,cls,aria){var b=document.createElement("button");b.type="button";b.className="key"+(cls?" "+cls:"");
 b.textContent=label;b.dataset.k=val;b.setAttribute("aria-label",aria||("key "+label));
 b.addEventListener("pointerdown",function(e){if(e.button>0)return;e.preventDefault();press(val,b)});
 b.addEventListener("click",function(e){if(e.detail===0)press(val,b)});return b}
rows.forEach(function(r,idx){var d=document.createElement("div");d.className="row";
 r.split("").forEach(function(c){d.appendChild(mk(c,c))});
 if(idx===2)d.appendChild(mk("⌫","Backspace","wide","backspace"));kb.appendChild(d)});
var last=document.createElement("div");last.className="row";
last.appendChild(mk("space"," ","space","space"));last.appendChild(mk("enter ♡","Enter","enter","enter, submit answer"));kb.appendChild(last);

function flash(val){var el=kb.querySelector('[data-k="'+(val===" "?" ":val)+'"]');if(!el)return;
 el.classList.add("down");setTimeout(function(){el.classList.remove("down")},110)}

function render(){disp.textContent="";
 if(!state.text){var p=document.createElement("span");p.className="ph";p.textContent="type your answer...";disp.appendChild(p)}
 else disp.appendChild(document.createTextNode(state.text));
 var c=document.createElement("span");c.className="cur";disp.appendChild(c)}

function press(val,btn){
 if(state.screen!==1||state.busy)return;
 if(btn){btn.classList.add("down");setTimeout(function(){btn.classList.remove("down")},110)}else flash(val);
 click();
 if(val==="Enter")return submit();
 if(val==="Backspace")state.text=state.text.slice(0,-1);
 else if(state.text.length<24)state.text+=val;
 err.textContent="";render()}

document.addEventListener("keydown",function(e){
 if(state.screen!==1||state.busy||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.target&&e.target.tagName==="BUTTON"&&(e.key==="Enter"||e.key===" "))return;
 var k=e.key;
 if(k==="Enter"||k==="Backspace"||k===" "||/^[a-zA-Z]$/.test(k)){e.preventDefault();press(k.length===1?k.toLowerCase():k,null)}});

var wrongMsgs=["WRONG ANSWER, BABY!! 😤💕","ummm try again, handsome 🙄💗","excuse me?? try again 😳💞","nope nope nope, one more try 🥺💘"],wi=0;
function submit(){
 if(state.busy)return;
 if(state.text.trim().toLowerCase()==="yes")return accept();
 err.textContent=wrongMsgs[wi++%wrongMsgs.length];err.classList.remove("pop");void err.offsetWidth;err.classList.add("pop");
 card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
 state.text="";render()}

/* particles */
function burst(emojis,n,y){var cx=innerWidth/2,cy=y||innerHeight*.42;n=reduce?Math.min(n,8):n;
 for(var i=0;i<n;i++){var p=document.createElement("span");p.className="p";p.textContent=emojis[i%emojis.length];
  var a=rnd(0,Math.PI*2),d=rnd(80,Math.min(innerWidth,420)*.8);
  p.style.cssText="left:"+cx+"px;top:"+cy+"px;--dx:"+Math.cos(a)*d+"px;--dy:"+(Math.sin(a)*d-60)+"px;--r:"+rnd(-40,40)+"deg;--s:"+rnd(16,32)+"px";
  p.addEventListener("animationend",function(){this.remove()});fx.appendChild(p)}}
function startFloaters(){if(floatTimer||reduce)return;var set=["💗","💖","💋","✨","💕","🩷"];
 floatTimer=setInterval(function(){if(fx.children.length>40)return;var f=document.createElement("span");f.className="fl";
  f.textContent=set[Math.floor(Math.random()*set.length)];var dur=rnd(5,9);
  f.style.cssText="left:"+rnd(2,94)+"%;font-size:"+rnd(16,34)+"px;--sw:"+rnd(-40,40)+"px;animation-duration:"+dur+"s";
  f.addEventListener("animationend",function(){this.remove()});fx.appendChild(f)},550)}

function later(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}

/* screen 1 -> 2 */
function accept(){
 state.busy=true;err.textContent="";
 burst(["💗","💖","💕","✨","🩷"],26);
 card.classList.add("closing");
 later(function(){$("s1").classList.remove("active");state.screen=2;
  later(function(){$("s2").classList.add("active");later(typeIt,900)},350)},(reduce?50:780))}

/* typewriter */
function typeIt(){
 var tok=++state.token,word="awwwwwww",i=0,out=$("typed");out.textContent="";
 (function step(){
  if(tok!==state.token)return;
  if(i>=word.length){
   later(function(){if(tok!==state.token)return;$("cur2").classList.add("off");
    later(function(){if(tok!==state.token)return;$("metoo").classList.add("show");burst(["💗","♡"],8,innerHeight*.35);
     later(function(){$("bear").classList.add("show");
      later(function(){var g=$("gift");g.disabled=false;g.classList.add("show")},600)},500)},600)},650);
   return}
  var s=document.createElement("span");s.className="ch";s.textContent=word[i++];out.appendChild(s);click(rnd(500,760));
  later(step,rnd(100,180)+(i===1?120:0))})()}

/* screen 2 -> 3 */
$("gift").onclick=function(){
 if(state.screen!==2||this.disabled)return;this.disabled=true;state.screen=3;
 $("s2").classList.remove("active");
 later(function(){$("s3").classList.add("active");
  later(function(){burst(["💋","💗","💖","💕","✨","🩷"],34)},550);startFloaters()},550)};
$("again").onclick=function(){burst(["💋","💗","💖","✨"],26);var k=$("kiss");k.style.animation="none";void k.offsetWidth;k.style.animation=""};

render();
window.addEventListener("pagehide",function(){clearTimers();clearInterval(floatTimer);floatTimer=null});
})();
</script>
</body>
</html>
